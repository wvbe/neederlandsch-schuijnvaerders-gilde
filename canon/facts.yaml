# exactly as written in the topic file. The Quartermaster-General (a human) decides what
# enters canon/facts.yaml; nothing here is canon until it is merged there.
g1:
  # the commissie due diligence
  bond_percent_of_expected_prize: 20          # of the registrar's estimate of the expected prize value
  bond_minimum_eur: 250000                    # floor under the percentage, posted at Middelburg
