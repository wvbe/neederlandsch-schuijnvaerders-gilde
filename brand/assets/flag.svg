<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="600" height="400">
  <title>Flag of the Neederlandsch Schuijnvaerders Gilde</title>
  <desc>Tar-black field; an indigo bend from lower hoist to upper fly; a lead-white fluyt heeling hard to leeward set over the bend; five minium-orange rings along the hoist, one for each chamber.</desc>
  <rect width="300" height="200" fill="#1B1A17"/>
  <polygon points="0,200 0,150 300,0 300,50" fill="#2E3A5F"/>
  <!-- heeling fluyt, simplified -->
  <g fill="#E9E4D6" transform="translate(150,105) rotate(-18)">
    <path d="M-70,20 Q-60,45 0,45 Q60,45 70,20 L55,20 Q0,30 -55,20 Z"/>
    <rect x="-4" y="-70" width="6" height="90"/>
    <path d="M2,-65 L48,-30 L2,-18 Z"/>
    <path d="M2,-18 L52,10 L2,18 Z"/>
    <rect x="-52" y="-45" width="5" height="65"/>
    <path d="M-47,-40 L-10,-12 L-47,0 Z"/>
  </g>
  <g fill="none" stroke="#C8501E" stroke-width="4">
    <circle cx="20" cy="20" r="7"/><circle cx="20" cy="46" r="7"/><circle cx="20" cy="72" r="7"/><circle cx="20" cy="98" r="7"/><circle cx="20" cy="124" r="7"/>
  </g>
</svg>
